<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>MVP Просмотр — Kenso / FixKD / RE:HVH</title>
  <meta name="description" content="MVP Просмотр — аудиоплеер для прослушивания треков Kenso, FixKD и RE:HVH. Удобный интерфейс, поиск, уникальная цветовая тема для каждого трека.">
  <meta name="keywords" content="MVP, Kenso, FixKD, RE:HVH, аудио, плеер, музыка, звуки, треки">
  <meta name="author" content="MVP View">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://mvpview.github.io/">

  <!-- Open Graph / соцсети (Facebook, VK, Telegram) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="MVP Просмотр — Kenso / FixKD / RE:HVH">
  <meta property="og:description" content="Аудиоплеер для треков Kenso, FixKD и RE:HVH с уникальной цветовой темой для каждого трека.">
  <meta property="og:image" content="https://mvpview.github.io/icon/og-image.svg">
  <meta property="og:url" content="https://mvpview.github.io/">
  <meta property="og:site_name" content="MVP View">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MVP Просмотр — Kenso / FixKD / RE:HVH">
  <meta name="twitter:description" content="Аудиоплеер для треков Kenso, FixKD и RE:HVH с уникальной цветовой темой для каждого трека.">
  <meta name="twitter:image" content="https://mvpview.github.io/icon/og-image.svg">

  <link rel="icon" type="image/svg+xml" href="icon/favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="icon-play" viewBox="0 0 24 24">
        <path d="M8 5.5v13l11-6.5z"></path>
      </symbol>
      <symbol id="icon-pause" viewBox="0 0 24 24">
        <rect x="6" y="5" width="4" height="14" rx="1"></rect>
        <rect x="14" y="5" width="4" height="14" rx="1"></rect>
      </symbol>
      <symbol id="icon-back" viewBox="0 0 24 24">
        <path d="M6 6h2.5v12H6z"></path>
        <path d="M17.5 6.5v11L8.5 12z"></path>
      </symbol>
      <symbol id="icon-next" viewBox="0 0 24 24">
        <path d="M15.5 6h2.5v12h-2.5z"></path>
        <path d="M6.5 6.5v11l9-5.5z"></path>
      </symbol>
    </defs>
  </svg>

  <div class="bg-glow" aria-hidden="true"></div>

  <header class="app-header">
    <span class="app-header__text">MVP Просмотр - Kenso / FixKD / RE:HVH</span>
  </header>

  <header class="player">
    <div class="player__art" id="playerArt">
      <div class="art-blob"></div>
      <img class="art-icon" id="artIcon" src="" alt="" width="44" height="44">
    </div>

    <div class="player__body">
      <div class="player__info">
        <div class="player__track-title" id="trackTitle">Выберите трек</div>
        <div class="player__sub" id="trackSub">None</div>
      </div>

      <div class="player__row">
        <div class="player__controls">
          <button class="ctl ctl--back" id="btnPrev" aria-label="Предыдущий">
            <svg class="ico ico--back"><use href="#icon-back"></use></svg>
          </button>
          <button class="ctl ctl--play" id="btnPlay" aria-label="Играть">
            <svg class="ico ico--play"><use href="#icon-play"></use></svg>
          </button>
          <button class="ctl ctl--next" id="btnNext" aria-label="Следующий">
            <svg class="ico ico--next"><use href="#icon-next"></use></svg>
          </button>
        </div>

        <div class="progress">
          <div class="progress__time" id="timeCur">0:00</div>
          <div class="progress__bar" id="bar">
            <div class="progress__fill" id="fill"></div>
            <div class="progress__thumb" id="thumb"></div>
          </div>
          <div class="progress__time" id="timeDur">0:00</div>
        </div>

        <div class="platforms platforms--player" id="playerPlatforms"></div>
      </div>
    </div>
  </header>

<main class="list-wrap">
    <div class="list-head">
      <span>Плейлист</span>
      <span class="list-head__count" id="countLabel"></span>
      <input type="text" class="search" id="search" placeholder="Поиск треков…">
    </div>
    <div class="columns">
      <div class="columns__cell columns__pad"></div>
      <div class="columns__cell columns__num">#</div>
      <div class="columns__cell columns__title">Название</div>
      <div class="columns__cell columns__platforms">Сервисы</div>
      <div class="columns__cell columns__date">Изменено</div>
    </div>
    <div class="list" id="list"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
